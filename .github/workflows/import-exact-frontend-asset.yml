name: Import exact reviewed frontend asset

on:
  push:
    branches:
      - integrate-frontend-0008

permissions:
  contents: write

jobs:
  import-asset:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Import and attest exact asset
        shell: bash
        run: |
          set -euo pipefail
          url='https://raw.githubusercontent.com/Al-Fe/sirius27-company-site-section/6f18669601db4ffef00cad4cf09ef2b10d66203e/assets/brand-sirius-pattern-seamless.png'
          expected_blob='4492f71409f0a23d7103c88143082aac962a524b'
          expected_sha256='301d027d6d9e7f5118f496b2531643233f7d4cf2feae7bb600f522c8724466a4'
          expected_size='1566692'
          target='assets/brand-sirius-pattern-seamless.png'
          tmp="${RUNNER_TEMP}/brand-sirius-pattern-seamless.png"

          curl --fail --location --proto '=https' --tlsv1.2 --silent --show-error             --output "$tmp" "$url"

          test "$(stat -c '%s' "$tmp")" = "$expected_size"
          test "$(sha256sum "$tmp" | awk '{print $1}')" = "$expected_sha256"
          test "$(git hash-object "$tmp")" = "$expected_blob"

          install -m 0644 "$tmp" "$target"
          test "$(git hash-object "$target")" = "$expected_blob"

          rm -- '.github/workflows/import-exact-frontend-asset.yml'

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "$target" '.github/workflows/import-exact-frontend-asset.yml'
          git commit -m 'Import exact reviewed frontend asset'
          git push origin HEAD:integrate-frontend-0008

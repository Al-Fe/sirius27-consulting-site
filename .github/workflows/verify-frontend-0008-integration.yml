name: Verify frontend 0008 integration

on:
  push:
    branches:
      - integrate-frontend-0008

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Verify exact integration boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat CNAME)" = 'sirius27.dpdns.org'
          test "$(git hash-object index.html)" = 'c3a54eea1af11b7b6f36a1ef75140545870d9a63'
          test "$(git hash-object tests/test_frontend_contract.py)" = '67c59a58ae7036372eafb37882b32fc67d42278f'
          test "$(git hash-object assets/brand-sirius-pattern-seamless.png)" = '4492f71409f0a23d7103c88143082aac962a524b'
          test "$(sha256sum assets/brand-sirius-pattern-seamless.png | awk '{print $1}')" = '301d027d6d9e7f5118f496b2531643233f7d4cf2feae7bb600f522c8724466a4'
          ! grep -R --fixed-strings '4site.sirius27.dpdns.org' -- CNAME index.html
          python -m unittest discover -s tests -v
      - name: Remove temporary verifier
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          rm -- '.github/workflows/verify-frontend-0008-integration.yml'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- '.github/workflows/verify-frontend-0008-integration.yml'
          git commit -m 'Remove temporary frontend integration verifier'
          git push origin HEAD:integrate-frontend-0008
